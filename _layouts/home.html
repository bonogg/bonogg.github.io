---
layout: default
---

<section class="hero">
  <div class="container">
    <h2>{{ site.title }}</h2>
    <p>{{ site.description }}</p>
  </div>
</section>

<section class="content">
  <div class="container">
    <h3>Recent posts</h3>
    <ul class="posts-list">
      {% for post in site.posts limit:5 %}
        <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> — <small>{{ post.date | date: "%b %-d, %Y" }}</small></li>
      {% endfor %}
    </ul>
  </div>
</section>
