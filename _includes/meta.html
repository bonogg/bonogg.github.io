<title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
<meta name="keywords" content="{{ site.keywords }}" />
{% if site.canonical %}<link rel="canonical" href="{{ site.canonical }}{{ page.url | relative_url }}" />{% endif %}
<link rel="icon" href="{{ site.favicon | relative_url }}" type="image/png" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<meta property="og:type" content="website" />
